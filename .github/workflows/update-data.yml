name: Oppdater quizdata

on:
  schedule:
    # GitHub cron kjører alltid i UTC. 04:00 UTC = 06:00 i Oslo om sommeren
    # (CEST) og 05:00 om vinteren (CET). Kilden oppdateres uansett sjelden,
    # så det er godt nok - poenget er å kjøre én gang i døgnet, tidlig.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Kjør gjennom selv om sikkerhetssjekkene slår ut"
        type: boolean
        default: false
      min_rows:
        description: "Minste antall quizer før byggingen feiler"
        type: string
        default: ""

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Kjør tester
        run: pnpm test

      - name: Hent kildesiden
        id: scrape
        run: |
          pnpm pipeline scrape
          # raw/latest.html is the source of truth for "did anything actually change".
          # data/quizzes.json alone is a bad signal because lastSeen moves every day,
          # which would otherwise commit a ~350 line no-op diff daily and bury the
          # real changes.
          if git diff --quiet -- raw/latest.html; then
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
            echo "Kilden er uendret siden forrige kjøring."
          else
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bygg data
        id: build
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.min_rows }}" ]; then
            ARGS="$ARGS --min-rows=${{ inputs.min_rows }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          pnpm pipeline build $ARGS

      # Exit code 2 means a safety rail tripped: the row count collapsed or too many ids
      # changed. That is exactly the case a human should look at, so we rebuild with
      # --force and route the result into a pull request instead of straight to main.
      - name: Bygg på nytt for gjennomgang når sikkerhetssjekkene slo ut
        if: steps.build.outcome == 'failure'
        run: pnpm pipeline build --force

      # Geocoding is deliberately fenced off from the rest of the job.
      #
      # It talks to Overpass, which is donated infrastructure and goes down or throttles
      # without warning. An outage there must never fail the daily data update or block a
      # deploy - yesterday's coordinates are still perfectly good. `--only-new` means the
      # normal day does nothing at all, because every venue is already in the cache; it
      # only wakes up when the source adds a venue we have never seen.
      - name: Geokod nye steder
        id: geocode
        continue-on-error: true
        timeout-minutes: 20
        if: steps.scrape.outputs.upstream_changed == 'true'
        run: pnpm pipeline geocode --only-new

      - name: Meld fra om at geokodingen feilet
        if: steps.geocode.outcome == 'failure'
        run: |
          echo "::warning::Geokodingen feilet (Overpass er trolig nede). \
          Kjøringen fortsetter med koordinatene som allerede ligger i cachen."

      # Fold any freshly resolved coordinates into data/quizzes.json. Purely local, no
      # network, so it cannot fail for the same reasons the step above can.
      - name: Bygg data på nytt med nye koordinater
        if: steps.geocode.outcome == 'success' && steps.scrape.outputs.upstream_changed == 'true'
        run: pnpm pipeline build ${{ steps.build.outcome == 'failure' && '--force' || '' }}

      - name: Se etter endringer
        id: diff
        run: |
          # When neither the source page nor the geocache moved, the only thing left in
          # data/quizzes.json is the daily lastSeen bump. Throw it away rather than
          # commit noise.
          if [ "${{ steps.scrape.outputs.upstream_changed }}" = "false" ] \
             && git diff --quiet -- data/geocache.json; then
            git checkout -- data/quizzes.json
          fi
          if [ -n "$(git status --porcelain raw data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          git --no-pager diff --stat raw data || true

      - name: Ingen endringer
        if: steps.diff.outputs.changed == 'false'
        run: echo "Ingen endringer i kildedata - ingenting å committe."

      - name: Commit direkte til main
        if: steps.diff.outputs.changed == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw data
          git commit -m "chore(data): oppdater quizdata fra Norges Quizforbund"
          git push

      - name: Opprett pull request når sikkerhetssjekkene slo ut
        if: steps.diff.outputs.changed == 'true' && steps.build.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data/oppdatering
          delete-branch: true
          add-paths: |
            raw
            data
          commit-message: "chore(data): oppdater quizdata (sikkerhetssjekk slo ut)"
          title: "Oppdatering av quizdata krever gjennomgang"
          body: |
            Den daglige jobben fant en endring som slo ut en av sikkerhetssjekkene:
            enten falt antall quizer under grensen, eller så endret mer enn 10 % av
            id-ene seg. Begge deler tyder vanligvis på at kilden har lagt om
            strukturen slik at parseren ikke lenger treffer.

            **Sjekk før du merger:**

            - Se på diffen i `raw/latest.html` - har kilden endret HTML-strukturen?
            - Se på diffen i `data/quizzes.json` - ser radene fortsatt riktige ut?
            - Hvis id-er har endret seg, husk at `data/overrides.json` og
              `data/geocache.json` er nøklet på id og må oppdateres tilsvarende.

            Er endringen reell (for eksempel en stor opprydding hos kilden), kan
            denne pull requesten merges som den er.
